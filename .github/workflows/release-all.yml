name: Release All Platforms (Desktop / Android / iOS / Docker)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空自动使用上游最新版）"
        required: false
        default: ""
  schedule:
    # 每天北京时间 08:00 (UTC 00:00) 自动检测上游更新
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check_ver.outputs.version }}
      should_skip: ${{ steps.check_ver.outputs.should_skip }}
    steps:
      - name: Determine Siyuan Version
        id: check_ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -z "$INPUT_VER" ]; then
            LATEST_TAG=""
            if RELEASE_JSON=$(curl --fail-with-body --silent --show-error --location --retry 3 --retry-all-errors \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/siyuan-note/siyuan/releases/latest); then
              LATEST_TAG=$(jq -er '.tag_name' <<<"${RELEASE_JSON}") || true
            fi

            if [ -z "$LATEST_TAG" ]; then
              echo "Warning: GitHub Releases API unavailable; falling back to stable Git tags."
              if ! TAG_REFS=$(git ls-remote --tags --refs https://github.com/siyuan-note/siyuan.git 'v*'); then
                echo "Error: Failed to fetch upstream tags."
                exit 1
              fi
              LATEST_TAG=$(printf '%s\n' "$TAG_REFS" | awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ { sub("refs/tags/", "", $2); print $2 }' | sort -V | tail -n 1)
            fi

            if [ -z "$LATEST_TAG" ]; then
              echo "Error: Failed to determine the latest official version."
              exit 1
            fi
            echo "Auto-detected latest official version: ${LATEST_TAG}"
            VERSION="${LATEST_TAG}"
          else
            echo "Using specified version: ${INPUT_VER}"
            VERSION="${INPUT_VER}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # 检查本仓库 Releases 是否已存在对应的 -unlock 版本
          TARGET_TAG="${VERSION}-unlock"
          HTTP_STATUS=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${TARGET_TAG}")
          if [ "$HTTP_STATUS" -eq 200 ] && [ "${{ github.event_name }}" == "schedule" ]; then
            echo "上游最新版本 ${VERSION} (${TARGET_TAG}) 已构建发布过，跳过本次定时构建。"
            echo "should_skip=true" >> $GITHUB_OUTPUT
          else
            echo "should_skip=false" >> $GITHUB_OUTPUT
          fi

  build-desktop:
    needs: check-version
    if: needs.check-version.outputs.should_skip != 'true'
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-24.04
            name: linux
            kernel_path: "../app/kernel-linux/SiYuan-Kernel"
            build_args_prefix: "-s -w -X"
            build_args_suffix: "Mode=prod"
            electron_args: "dist-linux"
            goos: "linux"
            goarch: "amd64"
            cc: ""
            cgo_cflags: ""
            cgo_ldflags: ""
            artifact_name: "desktop-linux"
          - os: macos-latest
            name: macos
            kernel_path: "../app/kernel-darwin/SiYuan-Kernel"
            build_args_prefix: "-s -w -X"
            build_args_suffix: "Mode=prod"
            electron_args: "dist-darwin"
            goos: "darwin"
            goarch: "amd64"
            cc: "clang -arch x86_64"
            cgo_cflags: "-arch x86_64"
            cgo_ldflags: "-arch x86_64"
            artifact_name: "desktop-macos"
          - os: macos-latest
            name: macos-arm64
            kernel_path: "../app/kernel-darwin-arm64/SiYuan-Kernel"
            build_args_prefix: "-s -w -X"
            build_args_suffix: "Mode=prod"
            electron_args: "dist-darwin-arm64"
            goos: "darwin"
            goarch: "arm64"
            cc: "clang -arch arm64"
            cgo_cflags: "-arch arm64"
            cgo_ldflags: "-arch arm64"
            artifact_name: "desktop-macos-arm64"
          - os: windows-latest
            name: windows
            kernel_path: "../app/kernel/SiYuan-Kernel.exe"
            build_args_prefix: "-s -w -H=windowsgui -X"
            build_args_suffix: "Mode=prod"
            electron_args: "dist"
            goos: "windows"
            goarch: "amd64"
            cc: ""
            cgo_cflags: ""
            cgo_ldflags: ""
            artifact_name: "desktop-windows"

    steps:
      - name: Checkout sy-build repository
        uses: actions/checkout@v6
        with:
          path: sy-build

      - name: Checkout official siyuan-note/siyuan
        uses: actions/checkout@v6
        with:
          repository: siyuan-note/siyuan
          ref: ${{ needs.check-version.outputs.version }}
          path: siyuan

      - name: Apply unlock patches
        working-directory: ${{ github.workspace }}/siyuan
        shell: bash
        run: bash ../sy-build/scripts/apply-patches.sh .

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan/kernel/go.mod
          cache-dependency-path: ${{ github.workspace }}/siyuan/kernel/go.sum
          cache: true

      - name: Set up goversioninfo (Windows)
        if: matrix.config.goos == 'windows'
        working-directory: ${{ github.workspace }}/siyuan/kernel
        shell: bash
        run: |
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        working-directory: ${{ github.workspace }}/siyuan/app
        shell: bash
        run: |
          packageManager=$(jq -r '.packageManager' package.json)
          npm install -g $packageManager

      - name: Build UI
        working-directory: ${{ github.workspace }}/siyuan/app
        run: |
          python3 -c "import pathlib; p=pathlib.Path('package.json'); p.write_text(p.read_text().replace('https://npmmirror.com/mirrors/electron/','https://github.com/electron/electron/releases/download/'))"
          pnpm install --prefer-frozen-lockfile
          pnpm run install:electron
          pnpm run build

      - name: Generate Icon Resource (Windows)
        if: matrix.config.goos == 'windows'
        working-directory: ${{ github.workspace }}/siyuan/kernel
        shell: cmd
        run: goversioninfo -platform-specific=true -icon="resource\icon.ico" -manifest="resource\goversioninfo.exe.manifest"

      - name: Build Kernel
        working-directory: ${{ github.workspace }}/siyuan/kernel
        shell: bash
        env:
          GO111MODULE: on
          CGO_ENABLED: 1
          GOOS: ${{ matrix.config.goos }}
          GOARCH: ${{ matrix.config.goarch }}
          CC: ${{ matrix.config.cc }}
          CGO_CFLAGS: ${{ matrix.config.cgo_cflags }}
          CGO_LDFLAGS: ${{ matrix.config.cgo_ldflags }}
        run: |
          go build -tags "fts5 sqlcipher" -o "${{ matrix.config.kernel_path }}" -ldflags "${{ matrix.config.build_args_prefix }} github.com/siyuan-note/siyuan/kernel/util.${{ matrix.config.build_args_suffix }}"

      - name: Install RPM tools (Linux)
        if: matrix.config.goos == 'linux'
        run: sudo apt-get install -y rpm

      - name: Build Electron App
        working-directory: ${{ github.workspace }}/siyuan/app
        run: pnpm run ${{ matrix.config.electron_args }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.artifact_name }}
          path: ${{ github.workspace }}/siyuan/app/build/siyuan-*

  build-android:
    needs: check-version
    if: needs.check-version.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout sy-build repository
        uses: actions/checkout@v6
        with:
          path: sy-build
          ref: ${{ github.sha }}

      - name: clone origin and apply patches
        env:
          SIYUAN_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ${{ github.workspace }}/go
          cd ${{ github.workspace }}

          git clone --branch "$SIYUAN_VERSION" --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          bash ${{ github.workspace }}/sy-build/scripts/apply-patches.sh .
          SIYUAN_SHA="$(git rev-parse HEAD)"

          cd ..

          git clone --branch "$SIYUAN_VERSION" --depth=1 https://github.com/siyuan-note/siyuan-android.git
          cd siyuan-android
          SIYUAN_ANDROID_SHA="$(git rev-parse HEAD)"
          SY_BUILD_SHA="$(git -C "${{ github.workspace }}/sy-build" rev-parse HEAD)"
          if [ "$SY_BUILD_SHA" != "$GITHUB_SHA" ]; then
            echo "ERROR: sy-build checkout SHA does not match GITHUB_SHA: expected $GITHUB_SHA, got $SY_BUILD_SHA"
            exit 1
          fi
          export SIYUAN_SHA SIYUAN_ANDROID_SHA SY_BUILD_SHA

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          def read_text(path):
              with path.open("r", encoding="utf-8", newline="") as handle:
                  return handle.read()

          def write_text(path, content):
              with path.open("w", encoding="utf-8", newline="") as handle:
                  handle.write(content)

          for filename in ("build.gradle", "settings.gradle"):
              path = Path(filename)
              if path.is_file():
                  content = read_text(path)
                  new_content = re.sub(
                      r"maven\s*\{\s*url\s*['\"]https?://maven\.aliyun\.com[^}]+?\}",
                      "// aliyun mirror removed",
                      content,
                      flags=re.DOTALL,
                  )
                  if new_content != content:
                      write_text(path, new_content)

          root_path = Path("build.gradle")
          if not root_path.is_file():
              raise SystemExit("ERROR: upstream root build.gradle is missing")
          root_content = read_text(root_path)
          version_code_matches = list(
              re.finditer(
                  r"(?m)^([ \t]*(?:def[ \t]+)?siyuanVersionCode[ \t]*=[ \t]*)([0-9]+)(?=[ \t]*(?://[^\r\n]*)?(?:\r?\n|$))",
                  root_content,
              )
          )
          if len(version_code_matches) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one integer siyuanVersionCode assignment in root build.gradle, "
                  f"found {len(version_code_matches)}"
              )
          version_name_matches = list(
              re.finditer(
                  r"(?m)^[ \t]*(?:def[ \t]+)?siyuanVersionName[ \t]*=[ \t]*(['\"])([^'\"\r\n]+)\1[ \t]*(?://[^\r\n]*)?$",
                  root_content,
              )
          )
          if len(version_name_matches) != 1:
              raise SystemExit(
                  "ERROR: expected exactly one quoted siyuanVersionName assignment in root build.gradle, "
                  f"found {len(version_name_matches)}"
              )
          base_version_code = int(version_code_matches[0].group(2))
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          if base_version_code <= 0 or run_number <= 0:
              raise SystemExit(
                  "ERROR: siyuanVersionCode and GITHUB_RUN_NUMBER must both be positive integers"
              )
          if run_number >= 100000:
              raise SystemExit(
                  "ERROR: GITHUB_RUN_NUMBER must be less than 100000 for the composite versionCode range"
              )
          version_code = base_version_code * 100000 + run_number
          if version_code > 2100000000:
              raise SystemExit(
                  "ERROR: composed Android versionCode exceeds the Android maximum of 2100000000: "
                  f"{version_code}"
              )
          version_name = version_name_matches[0].group(2)
          match = version_code_matches[0]
          rewritten_root = root_content[: match.start(2)] + str(version_code) + root_content[match.end(2) :]
          rewritten_name_matches = list(
              re.finditer(
                  r"(?m)^[ \t]*(?:def[ \t]+)?siyuanVersionName[ \t]*=[ \t]*(['\"])([^'\"\r\n]+)\1[ \t]*(?://[^\r\n]*)?$",
                  rewritten_root,
              )
          )
          if len(rewritten_name_matches) != 1 or rewritten_name_matches[0].group(2) != version_name:
              raise SystemExit("ERROR: versionName changed while rewriting root build.gradle")
          write_text(root_path, rewritten_root)

          app_path = Path("app/build.gradle")
          if not app_path.is_file():
              raise SystemExit("ERROR: upstream app/build.gradle is missing")
          app_content = read_text(app_path)
          app_content = app_content.replace(
              "apply from: rootProject.file('signings.gradle')",
              "//apply from: rootProject.file('signings.gradle')",
          )
          app_content = app_content.replace(
              "apply from: rootProject.file('buildRelease.gradle')",
              "//apply from: rootProject.file('buildRelease.gradle')",
          )
          app_content = app_content.replace(
              "implementation(name: 'kernel', ext: 'aar')",
              "implementation files('libs/kernel.aar')",
          )
          signing_block = '''
              signingConfigs {
                  release {
                      def ksFile = new File(rootProject.projectDir, "keystore/siyuan.jks")
                      storeFile ksFile
                      storePassword System.getenv("KEYSTORE_PASSWORD") ?: "123456"
                      keyAlias "siyuan"
                      keyPassword System.getenv("KEYSTORE_PASSWORD") ?: "123456"
                  }
              }
          '''
          if "android {" in app_content and "signingConfigs {" not in app_content:
              app_content = app_content.replace("android {", "android {" + signing_block, 1)
          app_content = app_content.replace(
              "signingConfig signingConfigs.siyuanConfig",
              "signingConfig signingConfigs.release",
          )
          if "signingConfigs {" not in app_content:
              raise SystemExit("ERROR: signingConfigs block injection failed - upstream may have changed app/build.gradle")
          if "signingConfig signingConfigs.release" not in app_content:
              raise SystemExit("ERROR: signingConfig ref replacement failed - upstream may have changed app/build.gradle")
          if "implementation files('libs/kernel.aar')" not in app_content:
              raise SystemExit("ERROR: local kernel.aar dependency replacement failed - upstream may have changed app/build.gradle")
          if "implementation(name: 'kernel', ext: 'aar')" in app_content:
              raise SystemExit("ERROR: upstream kernel AAR dependency is still present")
          write_text(app_path, app_content)

          env_file = os.environ.get("GITHUB_ENV")
          if not env_file:
              raise SystemExit("ERROR: GITHUB_ENV is unavailable")
          with open(env_file, "a", encoding="utf-8") as handle:
              handle.write(f"SY_BUILD_SHA={os.environ['SY_BUILD_SHA']}\n")
              handle.write(f"SIYUAN_SHA={os.environ['SIYUAN_SHA']}\n")
              handle.write(f"SIYUAN_ANDROID_SHA={os.environ['SIYUAN_ANDROID_SHA']}\n")
              handle.write(f"ANDROID_BASE_VERSION_CODE={base_version_code}\n")
              handle.write(f"ANDROID_VERSION_CODE={version_code}\n")
              handle.write(f"ANDROID_VERSION_NAME={version_name}\n")
          print(f"Resolved sy-build SHA: {os.environ['SY_BUILD_SHA']}")
          print(f"Resolved siyuan SHA: {os.environ['SIYUAN_SHA']}")
          print(f"Resolved siyuan-android SHA: {os.environ['SIYUAN_ANDROID_SHA']}")
          print(f"Android versionName: {version_name}")
          print(f"Android versionCode: {base_version_code} * 100000 + {run_number} = {version_code}")
          PY

          mkdir -p app/src/main/assets/
          mkdir -p app/libs/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan/kernel/go.mod
          cache-dependency-path: ${{ github.workspace }}/siyuan/kernel/go.sum

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        working-directory: ${{ github.workspace }}/siyuan/app
        shell: bash
        run: |
          packageManager=$(jq -r '.packageManager' package.json)
          npm install -g $packageManager

      - name: Install Node Dependencies
        run: pnpm install --prefer-frozen-lockfile
        working-directory: ${{ github.workspace }}/siyuan/app

      - name: Building UI
        run: pnpm run build
        working-directory: ${{ github.workspace }}/siyuan/app

      - name: Install gomobile
        working-directory: ${{ github.workspace }}/go
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Set up java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Building Android Kernel
        run: |
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/25* 2>/dev/null | tail -n 1)
            if [ -z "$NDK_PATH" ]; then
              NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
            fi
            export ANDROID_NDK_HOME="$NDK_PATH"
            echo "Using NDK: $ANDROID_NDK_HOME"
          fi
          gomobile bind --tags "fts5 sqlcipher" -androidapi 21 -target='android/arm64' -ldflags '-s -w' -v -o "../../../siyuan-android/app/libs/kernel.aar" ./
          KERNEL_AAR_PATH="${{ github.workspace }}/siyuan-android/app/libs/kernel.aar"
          test -s "$KERNEL_AAR_PATH"
          KERNEL_AAR_SHA256="$(sha256sum "$KERNEL_AAR_PATH" | awk '{print $1}')"
          echo "ANDROID_KERNEL_AAR_SHA256=$KERNEL_AAR_SHA256" >> "$GITHUB_ENV"
          echo "kernel.aar SHA256: $KERNEL_AAR_SHA256"
        working-directory: ${{ github.workspace }}/siyuan/kernel/mobile
        env:
          GO111MODULE: on
          CGO_ENABLED: 1

      - name: android assets
        shell: bash
        run: |
          mkdir -p ${{ github.workspace }}/siyuan-android/app/src/main/assets/
          test -f "${{ github.workspace }}/siyuan/app/stage/build/mobile/index.html"
          rm -f "${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip"
          cd ${{ github.workspace }}/siyuan/app
          zip -r "${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip" ./appearance ./guide ./stage
          cd ${{ github.workspace }}/siyuan
          if [ -d "changelogs" ]; then
            zip -rg "${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip" ./changelogs
          fi
          test -s "${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip"
          unzip -tqq "${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip"
          APP_ZIP_PATH="${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip"
          APP_ZIP_SHA256="$(sha256sum "$APP_ZIP_PATH" | awk '{print $1}')"
          echo "ANDROID_APP_ZIP_SHA256=$APP_ZIP_SHA256" >> "$GITHUB_ENV"
          echo "app.zip SHA256: $APP_ZIP_SHA256"

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: "siyuan.jks"
          fileDir: ${{ github.workspace }}/siyuan-android/keystore
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Verify Android signing key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456' }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${{ github.workspace }}/siyuan-android/keystore/siyuan.jks"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "ERROR: Android signing keystore is missing: $KEYSTORE_PATH"
            exit 1
          fi
          SIGNER_CERT_FILE="$(mktemp)"
          trap 'rm -f "$SIGNER_CERT_FILE"' EXIT
          keytool -exportcert \
            -keystore "$KEYSTORE_PATH" \
            -storepass:env KEYSTORE_PASSWORD \
            -alias siyuan \
            -file "$SIGNER_CERT_FILE" >/dev/null
          test -s "$SIGNER_CERT_FILE"
          ANDROID_SIGNER_SHA256="$(sha256sum "$SIGNER_CERT_FILE" | awk '{print $1}')"
          echo "ANDROID_SIGNER_SHA256=$ANDROID_SIGNER_SHA256" >> "$GITHUB_ENV"
          echo "Android signing certificate SHA-256: $ANDROID_SIGNER_SHA256"

      - name: Write Android provenance asset
        shell: bash
        run: |
          set -euo pipefail
          export PROVENANCE_PATH="${{ github.workspace }}/siyuan-android/app/src/main/assets/provenance.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = (
              "GITHUB_RUN_ID",
              "GITHUB_RUN_NUMBER",
              "SY_BUILD_SHA",
              "SIYUAN_SHA",
              "SIYUAN_ANDROID_SHA",
              "GITHUB_SHA",
              "ANDROID_VERSION_NAME",
              "ANDROID_VERSION_CODE",
              "ANDROID_APP_ZIP_SHA256",
              "ANDROID_KERNEL_AAR_SHA256",
              "ANDROID_SIGNER_SHA256",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("ERROR: missing Android provenance values: " + ", ".join(missing))
          run_id = int(os.environ["GITHUB_RUN_ID"])
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          version_code = int(os.environ["ANDROID_VERSION_CODE"])
          if run_id <= 0 or run_number <= 0 or version_code <= 0:
              raise SystemExit("ERROR: Android provenance numeric values must be positive")
          data = {
              "run_id": run_id,
              "run_number": run_number,
              "sy_build_sha": os.environ["SY_BUILD_SHA"],
              "siyuan_sha": os.environ["SIYUAN_SHA"],
              "siyuan_android_sha": os.environ["SIYUAN_ANDROID_SHA"],
              "version_name": os.environ["ANDROID_VERSION_NAME"],
              "version_code": version_code,
              "app_zip_sha256": os.environ["ANDROID_APP_ZIP_SHA256"],
              "kernel_aar_sha256": os.environ["ANDROID_KERNEL_AAR_SHA256"],
              "signer_sha256": os.environ["ANDROID_SIGNER_SHA256"],
          }
          path = Path(os.environ["PROVENANCE_PATH"])
          path.write_text(json.dumps(data, ensure_ascii=True, indent=2) + "\n", encoding="utf-8")
          print(f"Android provenance: {path}")
          print(json.dumps(data, ensure_ascii=True, sort_keys=True))
          PY
          test -s "$PROVENANCE_PATH"

      - name: Building Android
        working-directory: ${{ github.workspace }}/siyuan-android
        run: |
          chmod 777 ./gradlew
          ./gradlew :app:assembleOfficialRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || '123456' }}

      - name: Verify Android APK and publish provenance
        id: verify_android_apk
        shell: bash
        run: |
          set -euo pipefail
          apk_root="${{ github.workspace }}/siyuan-android/app/build/outputs/apk"
          mapfile -d '' -t apk_candidates < <(find "$apk_root" -type f -path '*/release/siyuan-*.apk' -print0)
          if (( ${#apk_candidates[@]} != 1 )); then
            echo "ERROR: expected exactly one APK matching **/release/siyuan-*.apk, found ${#apk_candidates[@]}"
            printf '%s\n' "${apk_candidates[@]}"
            exit 1
          fi
          APK_PATH="${apk_candidates[0]}"
          APP_ZIP_PATH="${{ github.workspace }}/siyuan-android/app/src/main/assets/app.zip"
          KERNEL_AAR_PATH="${{ github.workspace }}/siyuan-android/app/libs/kernel.aar"
          PROVENANCE_PATH="${{ github.workspace }}/siyuan-android/app/src/main/assets/provenance.json"
          test -s "$APP_ZIP_PATH"
          test -s "$KERNEL_AAR_PATH"
          test -s "$PROVENANCE_PATH"
          actual_app_zip_sha256="$(sha256sum "$APP_ZIP_PATH" | awk '{print $1}')"
          actual_kernel_aar_sha256="$(sha256sum "$KERNEL_AAR_PATH" | awk '{print $1}')"
          test "$actual_app_zip_sha256" = "$ANDROID_APP_ZIP_SHA256"
          test "$actual_kernel_aar_sha256" = "$ANDROID_KERNEL_AAR_SHA256"

          APKANALYZER_BIN="$(command -v apkanalyzer || true)"
          if [ -z "$APKANALYZER_BIN" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools" ]; then
            while IFS= read -r candidate; do
              if [ -x "$candidate" ]; then
                APKANALYZER_BIN="$candidate"
                break
              fi
            done < <(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/apkanalyzer' -print 2>/dev/null | sort -V)
          fi
          if [ -z "$APKANALYZER_BIN" ]; then
            echo "ERROR: Android SDK apkanalyzer was not found"
            exit 1
          fi
          manifest_application_id="$("$APKANALYZER_BIN" manifest application-id "$APK_PATH")"
          manifest_version_code="$("$APKANALYZER_BIN" manifest version-code "$APK_PATH")"
          manifest_version_name="$("$APKANALYZER_BIN" manifest version-name "$APK_PATH")"
          if [ "$manifest_application_id" != "org.b3log.siyuan" ]; then
            echo "ERROR: APK application-id mismatch: expected org.b3log.siyuan, got $manifest_application_id"
            exit 1
          fi
          if [ "$manifest_version_code" != "$ANDROID_VERSION_CODE" ]; then
            echo "ERROR: APK version-code mismatch: expected $ANDROID_VERSION_CODE, got $manifest_version_code"
            exit 1
          fi
          if [ "$manifest_version_name" != "$ANDROID_VERSION_NAME" ]; then
            echo "ERROR: APK version-name mismatch: expected $ANDROID_VERSION_NAME, got $manifest_version_name"
            exit 1
          fi
          echo "APK manifest: application-id=$manifest_application_id version-code=$manifest_version_code version-name=$manifest_version_name"

          APKSIGNER_BIN="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER_BIN" ] && [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            while IFS= read -r candidate; do
              if [ -x "$candidate" ]; then
                APKSIGNER_BIN="$candidate"
                break
              fi
            done < <(find "$ANDROID_HOME/build-tools" -type f -path '*/apksigner' -print 2>/dev/null | sort -V)
          fi
          if [ -z "$APKSIGNER_BIN" ]; then
            echo "ERROR: Android SDK apksigner was not found"
            exit 1
          fi
          signer_output="$("$APKSIGNER_BIN" verify --print-certs "$APK_PATH" 2>&1)"
          if printf '%s\n' "$signer_output" | grep -Fq 'Signer #2'; then
            echo "ERROR: APK contains an unexpected Signer #2"
            exit 1
          fi
          signer_digest_count="$(printf '%s\n' "$signer_output" | grep -Ec '^Signer #1 certificate SHA-256 digest: .*$' || true)"
          if [ "$signer_digest_count" -ne 1 ]; then
            echo "ERROR: apksigner did not return exactly one Signer #1 SHA-256 certificate digest"
            exit 1
          fi
          signer_digest_raw="$(printf '%s\n' "$signer_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          apk_signer_sha256="$(printf '%s' "$signer_digest_raw" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$apk_signer_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ERROR: APK signer SHA-256 digest is not exactly 64 lowercase hexadecimal characters"
            exit 1
          fi
          if [ "$apk_signer_sha256" != "$ANDROID_SIGNER_SHA256" ]; then
            echo "ERROR: APK signer SHA-256 mismatch: expected $ANDROID_SIGNER_SHA256, got $apk_signer_sha256"
            exit 1
          fi
          echo "APK signer certificate SHA-256: $apk_signer_sha256"

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          apk_unpacked="$verify_dir/apk"
          mkdir -p "$apk_unpacked"
          unzip -q "$APK_PATH" -d "$apk_unpacked"
          test -f "$apk_unpacked/assets/app.zip"
          test -f "$apk_unpacked/assets/provenance.json"
          cmp -- "$APP_ZIP_PATH" "$apk_unpacked/assets/app.zip"
          cmp -- "$PROVENANCE_PATH" "$apk_unpacked/assets/provenance.json"

          if ! unzip -Z1 "$KERNEL_AAR_PATH" | grep -Fqx 'jni/arm64-v8a/libgojni.so'; then
            echo "ERROR: kernel.aar does not contain jni/arm64-v8a/libgojni.so"
            exit 1
          fi
          if ! unzip -Z1 "$APK_PATH" | grep -Fqx 'lib/arm64-v8a/libgojni.so'; then
            echo "ERROR: APK does not contain lib/arm64-v8a/libgojni.so"
            exit 1
          fi
          unzip -p "$KERNEL_AAR_PATH" 'jni/arm64-v8a/libgojni.so' > "$verify_dir/kernel-libgojni.so"
          unzip -p "$APK_PATH" 'lib/arm64-v8a/libgojni.so' > "$verify_dir/apk-libgojni.so"
          cmp -- "$verify_dir/kernel-libgojni.so" "$verify_dir/apk-libgojni.so"

          jq -e --arg version_code "$ANDROID_VERSION_CODE" \
            '.version_code == ($version_code | tonumber)' \
            "$apk_unpacked/assets/provenance.json" >/dev/null
          APK_SHA256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "ANDROID_APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "Android APK path: $APK_PATH"
          echo "Android APK SHA256: $APK_SHA256"
          echo "Android APK versionCode: $ANDROID_VERSION_CODE"
          echo "Android APK provenance:"
          jq -S . "$apk_unpacked/assets/provenance.json"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.verify_android_apk.outputs.apk_path }}
          if-no-files-found: error

  build-ios:
    needs: check-version
    if: needs.check-version.outputs.should_skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sy-build repository
        uses: actions/checkout@v6
        with:
          path: sy-build

      - name: Checkout official siyuan-note/siyuan
        uses: actions/checkout@v6
        with:
          repository: siyuan-note/siyuan
          ref: ${{ needs.check-version.outputs.version }}
          path: siyuan

      - name: Checkout compatible siyuan-note/siyuan-ios
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PUBLISH_DATE=""
          if RELEASE_JSON=$(curl --fail-with-body --silent --show-error --location --retry 3 --retry-all-errors \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/siyuan-note/siyuan/releases/tags/${VERSION}"); then
            PUBLISH_DATE=$(jq -er '.published_at' <<<"${RELEASE_JSON}") || true
          fi

          if [ -z "$PUBLISH_DATE" ]; then
            PUBLISH_DATE=$(git -C siyuan show -s --format=%cI HEAD)
            echo "Warning: Release API unavailable; using Siyuan commit date ${PUBLISH_DATE}."
          fi
          echo "Siyuan ${VERSION} published at: ${PUBLISH_DATE}"

          # siyuan-ios 没有 tag，按 siyuan 发布日期找到兼容 commit
          git clone --filter=blob:none --no-checkout --single-branch https://github.com/siyuan-note/siyuan-ios.git siyuan-ios
          DEFAULT_REF=$(git -C siyuan-ios symbolic-ref refs/remotes/origin/HEAD)
          COMPATIBLE_COMMIT=$(git -C siyuan-ios rev-list -1 --before="${PUBLISH_DATE}" "${DEFAULT_REF}")
          if [ -z "$COMPATIBLE_COMMIT" ]; then
            echo "Error: No compatible siyuan-ios commit found before ${PUBLISH_DATE}."
            exit 1
          fi
          echo "Using compatible siyuan-ios commit: ${COMPATIBLE_COMMIT}"
          git -C siyuan-ios checkout --detach "${COMPATIBLE_COMMIT}"

      - name: Apply iOS compatibility patches
        working-directory: ${{ github.workspace }}/siyuan-ios
        shell: bash
        run: |
          PATCH="${{ github.workspace }}/sy-build/patches/siyuan-ios/nsitemprovider-loaditem-void.patch"
          SOURCE="ShorthandShare/ShareViewController.swift"
          if git apply --check "$PATCH"; then
            git apply --ignore-whitespace "$PATCH"
            echo "Applied NSItemProvider.loadItem compatibility patch."
          elif grep -q 'let progress = provider.loadItem(' "$SOURCE"; then
            echo "Error: NSItemProvider.loadItem still returns Void, but the compatibility patch no longer applies."
            exit 1
          else
            echo "Upstream no longer needs the NSItemProvider.loadItem compatibility patch."
          fi

      - name: Apply unlock patches
        working-directory: ${{ github.workspace }}/siyuan
        shell: bash
        run: bash ../sy-build/scripts/apply-patches.sh .

      - name: Fix iOS AppIcon and Project Settings
        working-directory: ${{ github.workspace }}/siyuan-ios
        shell: bash
        run: |
          if [ -d "siyuan-ios/Assets.xcassets/AppIcon.appiconset" ]; then
            cp -r siyuan-ios/Assets.xcassets/AppIcon.appiconset siyuan-ios/Assets.xcassets/logo.appiconset || true
          elif [ -d "Assets.xcassets/AppIcon.appiconset" ]; then
            cp -r Assets.xcassets/AppIcon.appiconset Assets.xcassets/logo.appiconset || true
          fi
          sed -i '' 's/MARKETING_VERSION =\(.*\)/MARKETING_VERSION = ${{ needs.check-version.outputs.version }};/g' siyuan-ios.xcodeproj/project.pbxproj || true
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER =\(.*\)/PRODUCT_BUNDLE_IDENTIFIER = com.ld246.siyuan.debug;/g' siyuan-ios.xcodeproj/project.pbxproj || true
          # 禁用代码签名：Automatic→Manual，清空签名身份，适配未签名构建
          python3 -c "
          import re
          with open('siyuan-ios.xcodeproj/project.pbxproj', 'r', encoding='utf-8') as f:
              c = f.read()
          c = re.sub(r'CODE_SIGN_STYLE = \w+', 'CODE_SIGN_STYLE = Manual', c)
          c = re.sub(r'CODE_SIGN_IDENTITY = \"[^\"]*\"', 'CODE_SIGN_IDENTITY = \"\"', c)
          with open('siyuan-ios.xcodeproj/project.pbxproj', 'w', encoding='utf-8') as f:
              f.write(c)
          print('pbxproj 签名设置已改为 Manual / 空签名身份')
          "

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan/kernel/go.mod
          cache-dependency-path: ${{ github.workspace }}/siyuan/kernel/go.sum
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        working-directory: ${{ github.workspace }}/siyuan/app
        shell: bash
        run: |
          packageManager=$(jq -r '.packageManager' package.json)
          npm install -g $packageManager

      - name: Build UI
        working-directory: ${{ github.workspace }}/siyuan/app
        run: |
          pnpm install --prefer-frozen-lockfile
          pnpm run build

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init

      - name: Building ios Kernel
        working-directory: ${{ github.workspace }}/siyuan/kernel/mobile
        run: |
          mkdir -p ../ios
          gomobile bind --tags "fts5 sqlcipher" -ldflags '-s -w' -v -target=ios -o "../ios/iosk.xcframework" ./
          cp -r ../ios/iosk.xcframework ${{ github.workspace }}/siyuan-ios/ || true
          cp -r ../ios/iosk.xcframework ${{ github.workspace }}/siyuan-ios/siyuan-ios/ || true
        env:
          GO111MODULE: on
          CGO_ENABLED: 1

      - name: iOS Assets
        working-directory: ${{ github.workspace }}/siyuan/app/
        run: |
          mkdir -p ${{ github.workspace }}/siyuan-ios/app/
          cp -r ./appearance ./guide ./stage ${{ github.workspace }}/siyuan-ios/app/
          if [ -d "../changelogs" ]; then
            cp -r ../changelogs ${{ github.workspace }}/siyuan-ios/app/ || true
          fi

      - name: Building iOS ipa (Unsigned Mode)
        working-directory: ${{ github.workspace }}/siyuan-ios
        shell: bash
        run: |
          mkdir -p ../siyuan-ios-out/Payload
          # 诊断：列出可用 scheme
          xcodebuild -project ./siyuan-ios.xcodeproj -list || true
          # 构建：-derivedDataPath 要求必须配合 -scheme（-target 不行）
          xcodebuild -project ./siyuan-ios.xcodeproj -scheme siyuan-ios -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath ../siyuan-ios-out
          mv ../siyuan-ios-out/Build/Products/Release-iphoneos/siyuan-ios.app ../siyuan-ios-out/Payload/
          cd ../siyuan-ios-out
          zip -r Payload.zip Payload
          mv Payload.zip siyuan-${{ needs.check-version.outputs.version }}-ios.ipa

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ github.workspace }}/siyuan-ios-out/siyuan-*-ios.ipa

  build-docker:
    needs: check-version
    if: needs.check-version.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free Disk Space (Native Clean)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true

      - name: Checkout sy-build repository
        uses: actions/checkout@v6
        with:
          path: sy-build

      - name: clone origin and apply patches
        run: |
          git clone --branch ${{ needs.check-version.outputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan
          bash ${{ github.workspace }}/sy-build/scripts/apply-patches.sh .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Export Docker Tarball
        working-directory: ${{ github.workspace }}/siyuan
        run: |
          docker buildx build --platform linux/amd64 -t b3log/siyuan:${{ needs.check-version.outputs.version }} --output type=docker,dest=${{ github.workspace }}/siyuan-${{ needs.check-version.outputs.version }}-docker.tar .

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-tarball
          path: ${{ github.workspace }}/siyuan-*-docker.tar

  release-all:
    needs: [check-version, build-desktop, build-android, build-ios, build-docker]
    if: needs.check-version.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Release All Platform Packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}-unlock
          name: "Siyuan Unlock ${{ needs.check-version.outputs.version }}"
          append_body: true
          files: release-artifacts/**/*
